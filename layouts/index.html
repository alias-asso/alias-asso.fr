{{ define "main" }}
{{ partial "header.html" }}

<div class="bg-accent-100 space-y-6 pb-18">
  <div x-data="carousel()" x-init="autoplay" class="relative w-full overflow-hidden">

    <div class="absolute left-0 right-0 top-1/2 z-20 max-w-5xl mx-auto flex justify-between -translate-y-1/2 px-5">
      <button type="button" class="flex rounded-full items-center justify-center bg-surface/40 p-2 text-on-surface transition hover:bg-surface/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:outline-offset-0 dark:bg-surface-dark/40 dark:text-on-surface-dark dark:hover:bg-surface-dark/60 dark:focus-visible:outline-primary-dark" aria-label="previous slide" x-on:click="previous()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3" class="text-white size-5 md:size-6 pr-0.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      </button>

      <button type="button" class="flex rounded-full items-center justify-center bg-surface/40 p-2 text-on-surface transition hover:bg-surface/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary active:outline-offset-0 dark:bg-surface-dark/40 dark:text-on-surface-dark dark:hover:bg-surface-dark/60 dark:focus-visible:outline-primary-dark" aria-label="next slide" x-on:click="next()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3" class="text-white size-5 md:size-6 pl-0.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>

    <div class="relative min-h-[75svh] w-full bg-black">
      <template x-for="(slide, index) in slides">
        <a x-bind:href="slide.href" x-cloak x-show="currentSlideIndex == index" class="absolute inset-0 group" x-transition.opacity.duration.1000ms>
          <div class="lg:px-32 lg:py-14 absolute inset-0 z-10 flex flex-col items-center justify-end gap-2 bg-linear-to-t from-surface-dark/85 to-transparent px-16 py-12 text-center">
            <h3 class="w-full lg:w-[80%] text-balance text-2xl lg:text-3xl font-bold text-on-surface-dark-strong group-hover:underline underline-offset-6" x-text="slide.title" x-bind:aria-describedby="'slide' + (index + 1) + 'Description'"></h3>
            <p class="lg:w-1/2 w-full text-pretty text-sm text-on-surface-dark" x-text="slide.description" x-bind:id="'slide' + (index + 1) + 'Description'"></p>
          </div>
          <div class="absolute w-full h-full inset-0">
            <img class="w-full h-full object-cover object-center" x-bind:src="slide.src" />
            <div class="absolute inset-0 bg-gray-900/30"></div>
          </div>
        </a>
      </template>
    </div>

      <div class="absolute rounded-radius bottom-3 md:bottom-5 left-1/2 z-20 flex -translate-x-1/2 gap-4 md:gap-3 px-1.5 py-1 md:px-2" role="group" aria-label="slides" >
        <template x-for="(slide, index) in slides">
            <button class="size-2 rounded-full transition" x-on:click="currentSlideIndex = index" x-bind:class="[currentSlideIndex === index ? 'bg-on-surface-dark' : 'bg-on-surface-dark/50']" x-bind:aria-label="'slide ' + (index)"></button>
        </template>
    </div>
  </div>

  <div class="max-w-4xl lg:max-w-5xl mx-auto py-8">
    <div class="mx-12 grid grid-cols-1 sm:grid-cols-3 gap-3">
    {{ range sort (where .Site.RegularPages "Section" "services") ".Params.order" "asc" }}
      <a href={{ or .Params.link .RelPermalink }} class="group flex items-center justify-between border border-accent-500/30 min-h-24 rounded-lg px-6 py-5 hover:shadow-md">
        <p class="text-lg group-hover:underline underline-offset-4 font-bold"> {{ .Params.title }} </p>
        <p class="text-4xl"> {{ .Params.logo }} </p>
      </a>
    {{ end }}
    </div>
  </div>

  <div class="max-w-xl mx-auto text-xl text-left">
    {{ .Content }}
  </div>
</div>

{{ partial "footer.html" }}

<script>
function carousel() {
  return {
    slides: window.slidesData,
    autoplayIntervalTime: 5000,
    autoplayInterval: null,
    currentSlideIndex: 0,
    previous() {
      this.currentSlideIndex = (this.currentSlideIndex + this.slides.length - 1) % this.slides.length
    },
    next() {
      this.currentSlideIndex = (this.currentSlideIndex + 1) % this.slides.length
    },
    autoplay() {
      this.autoplayInterval = setInterval(() => {
        this.next()
      }, this.autoplayIntervalTime)
    },
    setAutoplayInterval(newIntervalTime) {
      clearInterval(this.autoplayInterval)
      this.autoplayIntervalTime = newIntervalTime
      this.autoplay()
    }, 
  }
}
</script>

<script>
  window.slidesData = [
    {{ range sort (where .Site.RegularPages "Section" "activities") ".Params.date" "asc" }}
    {
      src: {{ .Params.src }},
      alt: {{ .Params.title }},
      title: {{ .Params.title }},
      description: {{ .Params.description }},
      href: {{ .RelPermalink }},
    },
    {{ end }}
  ];
</script>
{{ end }}
